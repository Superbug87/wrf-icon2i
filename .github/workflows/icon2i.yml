name: Prova ICON-2I
on:
  workflow_dispatch:
    inputs:
      comando:
        description: "ispeziona | scarica"
        default: ispeziona
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests eccodes numpy
      - name: Ispeziona
        if: inputs.comando == 'ispeziona'
        env:
          MH_EMAIL: ${{ secrets.MH_EMAIL }}
          MH_PASSWORD: ${{ secrets.MH_PASSWORD }}
        run: python3 wrf/ispeziona_icon2i.py
      - name: Scarica e converte due istanti
        if: inputs.comando == 'scarica'
        env:
          MH_EMAIL: ${{ secrets.MH_EMAIL }}
          MH_PASSWORD: ${{ secrets.MH_PASSWORD }}
        run: python3 wrf/scarica_icon2i.py --ciclo 2026101712 --ore 6 --passo 6 --out icon2i
      - uses: actions/upload-artifact@v4
        if: always() && inputs.comando == 'scarica'
        with:
          name: icon2i
          path: icon2i/
